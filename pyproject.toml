[project]
name = "vest"
version = "0.1.0"
description = "个人价值投资归因管线"
requires-python = ">=3.10"
dependencies = ["requests", "duckdb", "tzdata"]

[project.scripts]
vest = "vest.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vest"]
